    private static RegistrySupplier<Block> registerSimpleBlock(
            String name,
            Supplier<? extends Block> supplier
    ) {
        return registerBlockWithItem(
                name,
                supplier
        );
    }

    private static RegistrySupplier<Block> registerBlockWithItem(
            String name,
            Supplier<? extends Block> supplier
    ) {
        RegistrySupplier<Block> block =
                BLOCKS.register(
                        name,
                        supplier
                );

        ITEMS.register(
                name,
                () -> new BlockItem(
                        block.get(),
                        new Item.Properties()
                )
        );

        return block;
    }

    private static RegistrySupplier<Item> registerFood(
            String name,
            int nutrition,
            float saturation
    ) {
        return registerItem(
