plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

def bakeryGeneratedRoot = layout.buildDirectory
        .dir("generated/bakery")
        .get()
        .asFile

def bakeryGeneratedJava = new File(
        bakeryGeneratedRoot,
        "java"
)

def bakeryGeneratedResources = new File(
        bakeryGeneratedRoot,
        "resources"
)

def bakeryArchive = new File(
        layout.buildDirectory.get().asFile,
        "bakery-1.21.1-source.zip"
)

def existingSoundsFile = new File(
        layout.projectDirectory.asFile,
        "src/main/resources/assets/whatsits/sounds.json"
)

def prepareBakeryMerge = tasks.register("prepareBakeryMerge") {
    outputs.dir(bakeryGeneratedRoot)

    doLast {
        if (bakeryGeneratedRoot.exists()) {
            bakeryGeneratedRoot.deleteDir()
        }

        bakeryGeneratedJava.mkdirs()
        bakeryGeneratedResources.mkdirs()

        if (!bakeryArchive.exists()) {
            new URL(
                    "https://github.com/Let-s-Do-Collection/Bakery/archive/refs/heads/1.21.1.zip"
            ).withInputStream { input ->
                bakeryArchive.withOutputStream { output ->
                    output << input
                }
            }
        }

        def zip = new java.util.zip.ZipFile(bakeryArchive)

        try {
            /*
             * Bakery's Farm & Charm dependent systems are deliberately
             * excluded. Only the self-contained Bakery content is merged.
             */
            def keptCommonJava = [
                    "net/satisfy/bakery/client/renderer/block/CompletionistBannerRenderer.java",
                    "net/satisfy/bakery/core/block/CabinetBlock.java",
                    "net/satisfy/bakery/core/block/CompletionistBannerBlock.java",
                    "net/satisfy/bakery/core/block/CompletionistWallBannerBlock.java",
                    "net/satisfy/bakery/core/block/TableBlock.java",
                    "net/satisfy/bakery/core/block/entity/CabinetBlockEntity.java",
                    "net/satisfy/bakery/core/block/entity/CompletionistBannerEntity.java"
            ] as Set

            def writeText = { String relativePath, String text ->
                def destination = new File(
                        bakeryGeneratedJava,
                        relativePath
                )
                destination.parentFile.mkdirs()
                destination.text = text
            }

            /*
             * Our merged Bakery entry point.
             */
            writeText(
                    "net/satisfy/bakery/Bakery.java",
                    """package net.satisfy.bakery;

import net.minecraft.resources.ResourceLocation;
import net.satisfy.bakery.core.registry.EntityTypeRegistry;
import net.satisfy.bakery.core.registry.ObjectRegistry;
import net.satisfy.bakery.core.registry.SoundEventRegistry;

public class Bakery {
    public static final String MOD_ID = "whatsits";

    public static ResourceLocation identifier(String name) {
        return ResourceLocation.fromNamespaceAndPath(MOD_ID, name);
    }

    public static void init() {
        ObjectRegistry.init();
        EntityTypeRegistry.init();
        SoundEventRegistry.init();
    }
}
"""
            )

            /*
             * Client entry point with only the self-contained Bakery
             * banner renderer retained.
             */
            writeText(
                    "net/satisfy/bakery/client/BakeryClient.java",
                    """package net.satisfy.bakery.client;

import dev.architectury.registry.client.level.entity.EntityModelLayerRegistry;
import dev.architectury.registry.client.rendering.BlockEntityRendererRegistry;
import net.satisfy.bakery.client.renderer.block.CompletionistBannerRenderer;
import net.satisfy.bakery.core.registry.EntityTypeRegistry;

public class BakeryClient {
    public static void preInitClient() {
        EntityModelLayerRegistry.register(
                CompletionistBannerRenderer.LAYER_LOCATION,
                CompletionistBannerRenderer::createBodyLayer
        );
    }

    public static void initClient() {
        BlockEntityRendererRegistry.register(
                EntityTypeRegistry.BAKERY_BANNER.get(),
                CompletionistBannerRenderer::new
        );
    }
}
"""
            )

            /*
             * Only the Bakery block entities which survive without
             * Farm & Charm are registered.
             */
            writeText(
                    "net/satisfy/bakery/core/registry/EntityTypeRegistry.java",
                    """package net.satisfy.bakery.core.registry;

import dev.architectury.registry.registries.DeferredRegister;
import dev.architectury.registry.registries.RegistrySupplier;
import net.minecraft.core.registries.Registries;
import net.minecraft.world.level.block.entity.BlockEntityType;
import net.satisfy.bakery.Bakery;
import net.satisfy.bakery.core.block.CompletionistBannerBlock;
import net.satisfy.bakery.core.block.CompletionistWallBannerBlock;
import net.satisfy.bakery.core.block.CabinetBlock;
import net.satisfy.bakery.core.block.entity.CabinetBlockEntity;
import net.satisfy.bakery.core.block.entity.CompletionistBannerEntity;

public class EntityTypeRegistry {
    private static final DeferredRegister<BlockEntityType<?>> BLOCK_ENTITY_TYPES =
            DeferredRegister.create(Bakery.MOD_ID, Registries.BLOCK_ENTITY_TYPE);

    public static final RegistrySupplier<BlockEntityType<CabinetBlockEntity>> CABINET_BLOCK_ENTITY =
            BLOCK_ENTITY_TYPES.register(
                    "cabinet",
                    () -> BlockEntityType.Builder.of(
                            CabinetBlockEntity::new,
                            ObjectRegistry.CABINET.get(),
                            ObjectRegistry.DRAWER.get(),
                            ObjectRegistry.WALL_CABINET.get()
                    ).build(null)
            );

    public static final RegistrySupplier<BlockEntityType<CompletionistBannerEntity>> BAKERY_BANNER =
            BLOCK_ENTITY_TYPES.register(
                    "bakery_banner",
                    () -> BlockEntityType.Builder.of(
                            CompletionistBannerEntity::new,
                            ObjectRegistry.BAKERY_BANNER.get(),
                            ObjectRegistry.BAKERY_WALL_BANNER.get()
                    ).build(null)
            );

    public static void init() {
        BLOCK_ENTITY_TYPES.register();
    }
}
"""
            )

            /*
             * Self-contained Bakery registry.
             *
             * Anything whose implementation came from Farm & Charm is
             * intentionally not registered.
             */
            writeText(
                    "net/satisfy/bakery/core/registry/ObjectRegistry.java",
                    """package net.satisfy.bakery.core.registry;

import dev.architectury.registry.registries.DeferredRegister;
import dev.architectury.registry.registries.RegistrySupplier;
import net.minecraft.core.registries.Registries;
import net.minecraft.world.item.BlockItem;
import net.minecraft.world.item.Item;
import net.minecraft.world.item.SwordItem;
import net.minecraft.world.item.Tiers;
import net.minecraft.world.level.block.Block;
import net.minecraft.world.level.block.state.BlockBehaviour;
import net.minecraft.world.level.block.state.properties.NoteBlockInstrument;
import net.minecraft.world.level.block.Blocks;
import net.minecraft.world.level.block.SoundType;
import net.satisfy.bakery.Bakery;
import net.satisfy.bakery.core.block.CabinetBlock;
import net.satisfy.bakery.core.block.CompletionistBannerBlock;
import net.satisfy.bakery.core.block.CompletionistWallBannerBlock;
import net.satisfy.bakery.core.block.TableBlock;

public class ObjectRegistry {
    private static final DeferredRegister<Block> BLOCKS =
            DeferredRegister.create(Bakery.MOD_ID, Registries.BLOCK);

    private static final DeferredRegister<Item> ITEMS =
            DeferredRegister.create(Bakery.MOD_ID, Registries.ITEM);

    public static final RegistrySupplier<Block> BAKERY_BANNER =
            registerBlockWithItem(
                    "bakery_banner",
                    () -> new CompletionistBannerBlock(
                            BlockBehaviour.Properties.of()
                                    .strength(1.0F)
                                    .instrument(NoteBlockInstrument.BASS)
                                    .noCollission()
                                    .sound(SoundType.WOOD)
                    )
            );

    public static final RegistrySupplier<Block> BAKERY_WALL_BANNER =
            registerBlock(
                    "bakery_wall_banner",
                    () -> new CompletionistWallBannerBlock(
                            BlockBehaviour.Properties.of()
                                    .strength(1.0F)
                                    .instrument(NoteBlockInstrument.BASS)
                                    .noCollission()
                                    .sound(SoundType.WOOD)
                    )
            );

    public static final RegistrySupplier<Block> CABINET =
            registerBlockWithItem(
                    "cabinet",
                    () -> new CabinetBlock(
                            BlockBehaviour.Properties.of()
                                    .strength(2.0F, 3.0F)
                                    .sound(SoundType.WOOD),
                            SoundEventRegistry.CABINET_OPEN.get(),
                            SoundEventRegistry.CABINET_CLOSE.get()
                    )
            );

    public static final RegistrySupplier<Block> DRAWER =
            registerBlockWithItem(
                    "drawer",
                    () -> new CabinetBlock(
                            BlockBehaviour.Properties.of()
                                    .strength(2.0F, 3.0F)
                                    .sound(SoundType.WOOD),
                            SoundEventRegistry.DRAWER_OPEN.get(),
                            SoundEventRegistry.DRAWER_CLOSE.get()
                    )
            );

    public static final RegistrySupplier<Block> WALL_CABINET =
            registerBlockWithItem(
                    "wall_cabinet",
                    () -> new CabinetBlock(
                            BlockBehaviour.Properties.of()
                                    .strength(2.0F, 3.0F)
                                    .sound(SoundType.WOOD),
                            SoundEventRegistry.CABINET_OPEN.get(),
                            SoundEventRegistry.CABINET_CLOSE.get()
                    )
            );

    public static final RegistrySupplier<Block> IRON_TABLE =
            registerBlockWithItem(
                    "iron_table",
                    () -> new TableBlock(
                            BlockBehaviour.Properties.ofFullCopy(Blocks.IRON_BLOCK)
                    )
            );

    public static final RegistrySupplier<Item> ROLLING_PIN =
            registerItem(
                    "rolling_pin",
                    () -> new SwordItem(
                            Tiers.WOOD,
                            new Item.Properties()
                    )
            );

    public static final RegistrySupplier<Item> BREAD_KNIFE =
            registerItem(
                    "bread_knife",
                    () -> new SwordItem(
                            Tiers.IRON,
                            new Item.Properties()
                    )
            );

    private static <T extends Block> RegistrySupplier<T> registerBlock(
            String name,
            java.util.function.Supplier<T> blockSupplier
    ) {
        return BLOCKS.register(name, blockSupplier);
    }

    private static <T extends Block> RegistrySupplier<T> registerBlockWithItem(
            String name,
            java.util.function.Supplier<T> blockSupplier
    ) {
        RegistrySupplier<T> block = BLOCKS.register(name, blockSupplier);
        ITEMS.register(
                name,
                () -> new BlockItem(
                        block.get(),
                        new Item.Properties()
                )
        );
        return block;
    }

    private static <T extends Item> RegistrySupplier<T> registerItem(
            String name,
            java.util.function.Supplier<T> itemSupplier
    ) {
        return ITEMS.register(name, itemSupplier);
    }

    public static void init() {
        BLOCKS.register();
        ITEMS.register();
    }
}
"""
            )

            /*
             * Self-contained sound registry.
             */
            writeText(
                    "net/satisfy/bakery/core/registry/SoundEventRegistry.java",
                    """package net.satisfy.bakery.core.registry;

import dev.architectury.registry.registries.DeferredRegister;
import dev.architectury.registry.registries.RegistrySupplier;
import net.minecraft.core.registries.Registries;
import net.minecraft.resources.ResourceLocation;
import net.minecraft.sounds.SoundEvent;
import net.satisfy.bakery.Bakery;

public class SoundEventRegistry {
    private static final DeferredRegister<SoundEvent> SOUND_EVENTS =
            DeferredRegister.create(Bakery.MOD_ID, Registries.SOUND_EVENT);

    public static final RegistrySupplier<SoundEvent> COOKING_POT_HIT =
            create("cooking_pot_hit");

    public static final RegistrySupplier<SoundEvent> CAKE_CUT =
            create("cake_cut");

    public static final RegistrySupplier<SoundEvent> DRAWER_OPEN =
            create("drawer_open");

    public static final RegistrySupplier<SoundEvent> DRAWER_CLOSE =
            create("drawer_close");

    public static final RegistrySupplier<SoundEvent> CABINET_OPEN =
            create("cabinet_open");

    public static final RegistrySupplier<SoundEvent> CABINET_CLOSE =
            create("cabinet_close");

    private static RegistrySupplier<SoundEvent> create(String name) {
        ResourceLocation id = Bakery.identifier(name);
        return SOUND_EVENTS.register(
                name,
                () -> SoundEvent.createVariableRangeEvent(id)
        );
    }

    public static void init() {
        SOUND_EVENTS.register();
    }
}
"""
            )

            /*
             * Copy only the self-contained common Java files.
             */
            zip.entries().each { entry ->
                if (entry.isDirectory()) {
                    return
                }

                def path = entry.name
                def prefix = "Bakery-1.21.1/"

                if (!path.startsWith(prefix)) {
                    return
                }

                def relative = path.substring(prefix.length())

                if (relative.startsWith("common/src/main/java/")) {
                    def javaRelative = relative.substring(
                            "common/src/main/java/".length()
                    )

                    if (keptCommonJava.contains(javaRelative)) {
                        def text = zip.getInputStream(entry).getText("UTF-8")

                        /*
                         * The banner text originally thanks Farm & Charm.
                         * Keep the Bakery functionality but remove the
                         * external translation key.
                         */
                        text = text.replace(
                                'tooltip.farm_and_charm.thankyou_2',
                                'tooltip.bakery.banner.thankyou_2'
                        )

                        def destination = new File(
                                bakeryGeneratedJava,
                                javaRelative
                        )

                        destination.parentFile.mkdirs()
                        destination.text = text
                    }

                    return
                }

                /*
                 * Keep the NeoForge Bakery config and its platform values.
                 * They do not require Farm & Charm.
                 */
                if (relative ==
                        "neoforge/src/main/java/net/satisfy/bakery/platform/neoforge/PlatformHelperImpl.java") {

                    def text = zip.getInputStream(entry).getText("UTF-8")
                            .replace(
                                    "package net.satisfy.bakery.platform.neoforge;",
                                    "package net.satisfy.bakery.platform;"
                            )
                            .replace(
                                    "import net.satisfy.bakery.platform.PlatformHelper;\n\n",
                                    ""
                            )
                            .replace(
                                    "public class PlatformHelperImpl extends PlatformHelper",
                                    "public final class PlatformHelper"
                            )
                            .replace(
                                    "PlatformHelperImpl",
                                    "PlatformHelper"
                            )

                    writeText(
                            "net/satisfy/bakery/platform/PlatformHelper.java",
                            text
                    )

                    return
                }

                if (relative.startsWith(
                        "neoforge/src/main/java/net/satisfy/bakery/neoforge/core/config/"
                ) && relative.endsWith(".java")) {

                    def javaRelative = relative.substring(
                            "neoforge/src/main/java/".length()
                    )

                    writeText(
                            javaRelative,
                            zip.getInputStream(entry).getText("UTF-8")
                    )

                    return
                }

                /*
                 * ---------------------------------------------------------
                 * RESOURCES
                 * ---------------------------------------------------------
                 */
                if (relative.startsWith(
                        "common/src/main/resources/"
                )) {

                    def resourceRelative = relative.substring(
                            "common/src/main/resources/".length()
                    )

                    /*
                     * No Farm & Charm data can survive the merge.
                     */
                    if (resourceRelative.startsWith("data/farm_and_charm/")) {
                        return
                    }

                    /*
                     * The Bakery recipes/advancements depend heavily on
                     * Farm & Charm and/or removed Bakery systems.
                     */
                    if (resourceRelative.startsWith("data/bakery/recipe/") ||
                        resourceRelative.startsWith("data/bakery/advancement/")) {
                        return
                    }

                    if (resourceRelative.startsWith("data/bakery/worldgen/") ||
                        resourceRelative.startsWith("data/bakery/structure/") ||
                        resourceRelative.startsWith("data/bakery/tags/worldgen/")) {
                        return
                    }

                    if (resourceRelative.startsWith("assets/bakery/")) {
                        resourceRelative =
                                "assets/whatsits/" +
                                        resourceRelative.substring(
                                                "assets/bakery/".length()
                                        )
                    } else if (resourceRelative.startsWith("data/bakery/")) {
                        resourceRelative =
                                "data/whatsits/" +
                                        resourceRelative.substring(
                                                "data/bakery/".length()
                                        )
                    }

                    /*
                     * The existing Whatsits translations are retained.
                     */
                    if (resourceRelative ==
                            "assets/whatsits/lang/en_us.json") {
                        return
                    }

                    /*
                     * Existing Whatsits implementations.
                     */
                    if (resourceRelative.contains("/apple_pie_slice.")) {
                        return
                    }

                    if (resourceRelative.startsWith(
                            "assets/whatsits/blockstates/strawberry_jam"
                    ) ||
                        resourceRelative.startsWith(
                                "assets/whatsits/models/item/strawberry_jam"
                        ) ||
                        resourceRelative.startsWith(
                                "assets/whatsits/models/block/strawberry_jam"
                        ) ||
                        resourceRelative.startsWith(
                                "assets/whatsits/textures/item/strawberry_jam"
                        ) ||
                        resourceRelative.startsWith(
                                "assets/whatsits/textures/block/strawberry_jam"
                        ) ||
                        resourceRelative.startsWith(
                                "data/whatsits/loot_table/blocks/strawberry_jam"
                        )) {
                        return
                    }

                    /*
                     * sounds.json is merged with the existing Whatsits
                     * sound definitions.
                     */
                    if (resourceRelative ==
                            "assets/whatsits/sounds.json") {
                        return
                    }

                    if (resourceRelative.endsWith(".json") ||
                        resourceRelative.endsWith(".mcmeta") ||
                        resourceRelative.endsWith(".txt")) {

                        def text =
                                zip.getInputStream(entry).getText("UTF-8")

                        /*
                         * A textual resource referencing Farm & Charm cannot
                         * be safely used without that mod.
                         */
                        if (text.contains("farm_and_charm")) {
                            return
                        }

                        def destination = new File(
                                bakeryGeneratedResources,
                                resourceRelative
                        )

                        destination.parentFile.mkdirs()

                        destination.text = text
                                .replace("bakery:", "whatsits:")
                                .replace("bakery.", "whatsits.")

                    } else {

                        def destination = new File(
                                bakeryGeneratedResources,
                                resourceRelative
                        )

                        destination.parentFile.mkdirs()
                        destination.bytes =
                                zip.getInputStream(entry).bytes
                    }
                }
            }

            /*
             * Merge Bakery's sounds.json with the existing Whatsits one.
             */
            def bakerySoundsEntry = zip.getEntry(
                    "Bakery-1.21.1/common/src/main/resources/assets/bakery/sounds.json"
            )

            Map mergedSounds = new LinkedHashMap()

            if (bakerySoundsEntry != null) {
                def bakerySounds =
                        new groovy.json.JsonSlurper().parseText(
                                zip.getInputStream(bakerySoundsEntry)
                                        .getText("UTF-8")
                        )

                if (bakerySounds instanceof Map) {
                    bakerySounds.each { name, definition ->
                        def converted =
                                new groovy.json.JsonSlurper().parseText(
                                        groovy.json.JsonOutput.toJson(
                                                definition
                                        )
                                                .replace(
                                                        "bakery:",
                                                        "whatsits:"
                                                )
                                                .replace(
                                                        "bakery.",
                                                        "whatsits."
                                                )
                                )

                        mergedSounds[name] = converted
                    }
                }
            }

            if (existingSoundsFile.exists()) {
                def existing =
                        new groovy.json.JsonSlurper().parseText(
                                existingSoundsFile.getText("UTF-8")
                        )

                if (existing instanceof Map) {
                    existing.each { name, definition ->
                        mergedSounds[name] = definition
                    }
                }
            }

            def mergedSoundsFile = new File(
                    bakeryGeneratedResources,
                    "assets/whatsits/sounds.json"
            )

            mergedSoundsFile.parentFile.mkdirs()
            mergedSoundsFile.text =
                    groovy.json.JsonOutput.prettyPrint(
                            groovy.json.JsonOutput.toJson(mergedSounds)
                    ) + "\n"

        } finally {
            zip.close()
        }
    }
}

sourceSets.main.java.srcDir(new File(bakeryGeneratedDir.get().asFile, "java"))
sourceSets.main.resources.srcDir(new File(bakeryGeneratedDir.get().asFile, "resources"))

repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven {
        url = "https://cursemaven.com"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    localRuntime "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE"

    implementation "curse.maven:farmers-delight-398521:8765184"

    compileOnly "dev.architectury:architectury-neoforge:13.0.8"

    runtimeOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    dependsOn(prepareBakeryMerge)
}

tasks.named("processResources").configure {
    dependsOn(prepareBakeryMerge)

    /*
     * The Bakery merge task creates a combined sounds.json. Exclude the
     * original Whatsits copy from the normal source set and add the merged
     * file explicitly.
     */
    setSource(
            sourceSets.main.resources.matching {
                exclude("assets/whatsits/sounds.json")
            }
    )

    from(bakeryGeneratedResources) {
        include("assets/whatsits/sounds.json")
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}