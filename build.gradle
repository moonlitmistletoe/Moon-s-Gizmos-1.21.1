plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        url = 'https://maven.architectury.dev'
    }

    maven {
        url = 'https://maven.blamejared.com'
    }

    maven {
        url = 'https://api.modrinth.com/maven'
    }

    maven {
        url = "https://cursemaven.com"
    }

    maven {
        url = "https://maven.theillusivec4.top/"
    }

    maven {
        name = "KosmX's Maven"
        url = "https://maven.kosmx.dev/"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion =
        JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion =
                project.parchment_mappings_version

        minecraftVersion =
                project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty(
                    'neoforge.enabledGameTestNamespaces',
                    project.mod_id
            )
        }

        server {
            server()

            programArgument '--nogui'

            systemProperty(
                    'neoforge.enabledGameTestNamespaces',
                    project.mod_id
            )
        }

        gameTestServer {
            type = "gameTestServer"

            systemProperty(
                    'neoforge.enabledGameTestNamespaces',
                    project.mod_id
            )
        }

        data {
            data()

            programArguments.addAll(
                    '--mod',
                    project.mod_id,
                    '--all',
                    '--output',
                    file(
                            'src/generated/resources/'
                    ).getAbsolutePath(),
                    '--existing',
                    file(
                            'src/main/resources/'
                    ).getAbsolutePath()
            )
        }

        configureEach {
            systemProperty(
                    'forge.logging.markers',
                    'REGISTRIES'
            )

            logLevel =
                    org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    jarJar(
            implementation(
                    "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE"
            )
    ) {
        version {
            strictly "[1.21.1-93-NEOFORGE]"
        }
    }

    implementation "dev.kosmx.player-anim:player-animation-lib-forge:2.0.4+1.21.1"

    implementation "curse.maven:farmers-delight-398521:8765184"

    implementation "dev.architectury:architectury-neoforge:13.0.11"

    // Farm & Charm is source-merged into Morrow at build time.


    runtimeOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"

    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"
}

var generateModMetadata =
        tasks.register(
                "generateModMetadata",
                ProcessResources
        ) {

            var replaceProperties = [
                    minecraft_version      : minecraft_version,
                    minecraft_version_range: minecraft_version_range,
                    neo_version            : neo_version,
                    loader_version_range   : loader_version_range,
                    mod_id                 : mod_id,
                    mod_name               : mod_name,
                    mod_license            : mod_license,
                    mod_version            : mod_version,
            ]

            inputs.properties replaceProperties

            expand replaceProperties

            from "src/main/templates"

            into "build/generated/sources/modMetadata"
        }

sourceSets.main.resources.srcDir(
        generateModMetadata
)

neoForge.ideSyncTask(
        generateModMetadata
)

publishing {
    publications {
        register(
                'mavenJava',
                MavenPublication
        ) {
            from components.java
        }
    }

    repositories {
        maven {
            url =
                    "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


def prepareFarmAndCharm = tasks.register("prepareFarmAndCharm") {
    def archive = layout.buildDirectory.file("farm_and_charm/FarmAndCharm.zip")
    def unpacked = layout.buildDirectory.dir("farm_and_charm/upstream")
    def generatedJava = layout.buildDirectory.dir("farm_and_charm/generated/java")
    def generatedResources = layout.buildDirectory.dir("farm_and_charm/generated/resources")

    outputs.dirs(generatedJava, generatedResources)

    doLast {
        def archiveFile = archive.get().asFile
        if (!archiveFile.exists()) {
            archiveFile.parentFile.mkdirs()
            new URI("https://github.com/Let-s-Do-Collection/FarmAndCharm/archive/refs/heads/1.21.1.zip")
                    .toURL()
                    .withInputStream { input ->
                        archiveFile.withOutputStream { output -> output << input }
                    }
        }

        def upstreamDir = unpacked.get().asFile
        if (upstreamDir.exists()) {
            project.delete(upstreamDir)
        }

        project.copy {
            from project.zipTree(archiveFile)
            into upstreamDir
        }

        def root = upstreamDir.listFiles()?.find { it.isDirectory() } ?: upstreamDir
        def javaOut = generatedJava.get().asFile
        def resOut = generatedResources.get().asFile
        project.delete(javaOut, resOut)
        javaOut.mkdirs()
        resOut.mkdirs()

        def removed = [
                "fertilizer", "pitchfork", "yeast", "butter", "dough", "raw_pasta",
                "flour", "minced_beef", "lamb_ham", "bacon", "chicken_parts",
                "corn", "barley", "oat", "strawberry", "lettuce", "tomato",
                "rotten_tomato", "compost", "nettle_tea_cup", "ribwort_tea_cup",
                "chicken_feed", "horse_fodder", "horse_feeder", "tomato_seeds",
                "lettuce_seeds", "strawberry_seeds", "oat_seeds", "barley_seeds",
                "kernels", "corn_kernels", "onion", "wild_ribwort", "wild_nettle",
                "wild_corn", "wild_barley", "wild_oat", "wild_tomatoes",
                "wild_lettuce", "wild_onions", "wild_strawberries",
                "lettuce_bag", "tomato_bag", "corn_bag", "onion_bag", "flour_bag",
                "oat_ball", "barley_ball", "oat_bale", "barley_bale",
                "fertilized_soil", "fertilized_farmland", "silo_wood", "silo_copper",
                "wooden_silo", "copper_silo", "stove", "mincer", "crafting_bowl",
                "cooking_pot", "roaster", "window_sill", "scarecrow", "nettle_tea",
                "ribwort_tea", "chicken_nest", "chicken_coop", "oat_pancake",
                "roasted_corn", "potato_with_roast_meat", "baked_lamb_ham",
                "farmers_breakfast", "stuffed_chicken", "stuffed_rabbit",
                "grandmothers_strawberry_cake", "grandmas_strawberry_cake",
                "farmers_bread", "farmer_salad", "goulash", "simple_tomato_soup",
                "barley_soup", "onion_soup", "potato_soup", "pasta_with_onion_sauce",
                "corn_grits", "oatmeal_with_strawberries", "sausage_with_oat_patty",
                "lamb_with_corn", "beef_patty_with_vegetables",
                "barley_patties_with_potatoes", "barley_patty_with_potatoes",
                "bacon_with_eggs", "chicken_wrapped_in_bacon",
                "chicken_wrapped_in_bacon_with_noodles", "cooked_salmon", "cooked_cod",
                "roasted_chicken", "rope", "packed_dirt", "trampled_packed_dirt",
                "stable_floor", "trampled_stable_floor", "straw_stable_floor",
                "cattlegrid", "timber_well"
        ] as Set

        def shouldRemovePath = { String path ->
            def lower = path.toLowerCase()
            if (lower.contains("/advancement/")) return true
            if (lower.contains("/recipe/crafting_bowl")) return true
            if (lower.contains("/recipe/pot_cooking/")) return true
            if (lower.contains("/recipe/stirring")) return true
            if (lower.contains("/recipe/cooking_pot")) return true
            if (lower.contains("/recipe/timber_well")) return true
            return removed.any { name ->
                lower.tokenize('/').any { part ->
                    part == name || part.startsWith(name + ".") || part.startsWith(name + "_")
                }
            }
        }

        def rewrite = { String text ->
            text
                    .replace("farm_and_charm:", "morrow:")
                    .replace("farm_and_charm.", "morrow.")
                    .replace('MOD_ID = "farm_and_charm"', 'MOD_ID = "morrow"')
                    .replace("TabRegistry.init();", "")
        }

        [new File(root, "common/src/main/java"), new File(root, "neoforge/src/main/java")].each { sourceRoot ->
            if (!sourceRoot.exists()) return
            project.fileTree(sourceRoot).matching { include "**/*.java" }.files.each { source ->
                def relative = source.path.substring(sourceRoot.path.length() + 1)
                def target = new File(javaOut, relative)
                target.parentFile.mkdirs()
                def text = rewrite(source.getText("UTF-8"))

                if (relative.endsWith("FarmAndCharmNeoForge.java")) {
                    text = text.replace("@Mod(FarmAndCharm.MOD_ID)", "")
                }

                if (relative.endsWith("ObjectRegistry.java")) {
                    text = text.readLines().findAll { line ->
                        !removed.any { name ->
                            line.contains('registerItem("' + name + '"') ||
                            line.contains('registerWithItem("' + name + '"') ||
                            line.contains('registerWithoutItem("' + name + '"') ||
                            line.contains('registerTea("' + name + '"')
                        }
                    }.join("\n") + "\n"
                }

                target.setText(text, "UTF-8")
            }
        }

        [new File(root, "common/src/main/resources"), new File(root, "neoforge/src/main/resources")].each { sourceRoot ->
            if (!sourceRoot.exists()) return
            project.fileTree(sourceRoot).files.each { source ->
                def relative = source.path.substring(sourceRoot.path.length() + 1)
                if (relative.startsWith("META-INF/")) return
                if (relative == "FarmAndCharm-neoforge.mixins.json") {
                    relative = "morrow-farm-and-charm.mixins.json"
                }
                if (shouldRemovePath(relative)) return

                def targetRelative = relative
                        .replace("assets/farm_and_charm", "assets/morrow")
                        .replace("data/farm_and_charm", "data/morrow")
                def target = new File(resOut, targetRelative)
                target.parentFile.mkdirs()

                if (source.name.endsWith(".json") || source.name.endsWith(".mcmeta") || source.name.endsWith(".lang")) {
                    def text = rewrite(source.getText("UTF-8"))
                    def resultMatches = (text =~ /"id"\s*:\s*"morrow:([^"]+)"/).collect { it[1] }
                    if (resultMatches.any { removed.contains(it) }) return

                    removed.each { name ->
                        text = text.replaceAll('(?m)^\\s*"morrow:' + name + '"\\s*,?\\s*\\n?', "")
                    }
                    target.setText(text, "UTF-8")
                } else {
                    project.copy { from source; into target.parentFile; rename { target.name } }
                }
            }
        }
    }
}

sourceSets.main.java.srcDir(prepareFarmAndCharm.map { layout.buildDirectory.dir("farm_and_charm/generated/java").get().asFile })
sourceSets.main.resources.srcDir(prepareFarmAndCharm.map { layout.buildDirectory.dir("farm_and_charm/generated/resources").get().asFile })

tasks.named("compileJava").configure { dependsOn(prepareFarmAndCharm) }
tasks.named("processResources").configure { dependsOn(prepareFarmAndCharm) }

def decodeBakeryStructure = tasks.register("decodeBakeryStructure") {
    def source = file("src/main/resources/data/morrow/structure/bakery.nbt.base64")
    def output = layout.buildDirectory.file(
            "generated/resources/data/morrow/structure/bakery.nbt"
    )

    inputs.file(source)
    outputs.file(output)

    doLast {
        output.get().asFile.parentFile.mkdirs()
        output.get().asFile.bytes =
                java.util.Base64.decoder.decode(
                        source.text.replaceAll("\\s", "")
                )
    }
}

tasks.named(
        "processResources"
).configure {
    dependsOn(decodeBakeryStructure)

    duplicatesStrategy =
            DuplicatesStrategy.INCLUDE

    exclude("**/*.base64")

    notCompatibleWithConfigurationCache("Rewrites merged Bakery resource namespaces after processing")

    doLast {
        def resourceRoot = new File(destinationDir, "assets/morrow")

        if (resourceRoot.exists()) {
            fileTree(resourceRoot)
                    .matching {
                        include("**/*.json")
                        include("**/*.mcmeta")
                    }
                    .each { file ->
                        def text = file.getText("UTF-8")

                        def fixed = text
                                .replace("bakery:", "whatsits:")
                                .replace("bakery.", "whatsits.")

                        if (fixed != text) {
                            file.setText(fixed, "UTF-8")
                        }
                    }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
