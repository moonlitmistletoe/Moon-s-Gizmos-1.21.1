tasks.named(
        "processResources"
).configure {

    dependsOn(prepareBakeryMerge)

    duplicatesStrategy =
            DuplicatesStrategy.INCLUDE

    doLast {

        def outputLang = new File(
                destinationDir,
                "assets/whatsits/lang/en_us.json"
        )

        if (bakeryLangFile.exists() &&
                outputLang.exists()) {

            def bakeryLang =
                    new groovy.json.JsonSlurper().parseText(
                            bakeryLangFile.getText(
                                    "UTF-8"
                            )
                    )

            def whatsitsLang =
                    new groovy.json.JsonSlurper().parseText(
                            outputLang.getText(
                                    "UTF-8"
                            )
                    )

            def removedKeys = [
                    "banner",
                    "cabinet",
                    "drawer",
                    "wall_cabinet",
                    "iron_bench",
                    "iron_chair",
                    "iron_table",
                    "street_sign",
                    "kitchen_sink",
                    "baker_station",
                    "brick_counter",
                    "cake_stand",
                    "cake_display",
                    "cupcake_display",
                    "breadbox",
                    "tray",
                    "bread_crate",
                    "wall_display",
                    "chocolate_box",
                    "small_cooking_pot"
            ]

            Map mergedLang =
                    new LinkedHashMap()

            if (bakeryLang instanceof Map) {

                bakeryLang.each {
                    key, value ->

                        def lowerKey =
                                key.toString()
                                        .toLowerCase()

                        if (!removedKeys.any {
                            lowerKey.contains(it)
                        }) {

                            mergedLang[
                                    key.toString()
                                            .replace(
                                                    "bakery.",
                                                    "whatsits."
                                            )
                                            .replace(
                                                    "bakery:",
                                                    "whatsits:"
                                            )
                            ] = value
                        }
                }
            }

            if (whatsitsLang instanceof Map) {

                whatsitsLang.each {
                    key, value ->
                        mergedLang[key] = value
                }
            }

            outputLang.parentFile.mkdirs()

            outputLang.text =
                    groovy.json.JsonOutput.prettyPrint(
                            groovy.json.JsonOutput.toJson(
                                    mergedLang
                            )
                    ) + "\n"
        }
    }
}

