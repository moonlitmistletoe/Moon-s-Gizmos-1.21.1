plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

def bakeryGeneratedRoot = layout.buildDirectory
        .dir("generated/bakery")
        .get()
        .asFile

def bakeryGeneratedJava = new File(
        bakeryGeneratedRoot,
        "java"
)

def bakeryGeneratedResources = new File(
        bakeryGeneratedRoot,
        "resources"
)

def bakeryLangFile = new File(
        bakeryGeneratedRoot,
        "bakery_en_us.json"
)

def bakeryArchive = new File(
        layout.buildDirectory.get().asFile,
        "bakery-1.21.1-source.zip"
)

def prepareBakeryMerge = tasks.register("prepareBakeryMerge") {
    outputs.dir(bakeryGeneratedRoot)

    doLast {
        if (bakeryGeneratedRoot.exists()) {
            bakeryGeneratedRoot.deleteDir()
        }

        bakeryGeneratedJava.mkdirs()
        bakeryGeneratedResources.mkdirs()

        if (!bakeryArchive.exists()) {
            new URL(
                    "https://github.com/Let-s-Do-Collection/Bakery/archive/refs/heads/1.21.1.zip"
            ).withInputStream { input ->
                bakeryArchive.withOutputStream { output ->
                    output << input
                }
            }
        }

        def zip = new java.util.zip.ZipFile(bakeryArchive)

        try {
            def writeText = { String relativePath, String text ->
                def destination = new File(
                        bakeryGeneratedJava,
                        relativePath
                )

                destination.parentFile.mkdirs()
                destination.text = text
            }

            def writeResourceText = { String relativePath, String text ->
                def destination = new File(
                        bakeryGeneratedResources,
                        relativePath
                )

                destination.parentFile.mkdirs()
                destination.text = text
            }

            writeText(
                    "net/satisfy/bakery/Bakery.java",
                    """package net.satisfy.bakery;

import net.minecraft.resources.ResourceLocation;
import net.satisfy.bakery.core.registry.ObjectRegistry;

public class Bakery {
    public static final String MOD_ID = "whatsits";

    public static ResourceLocation identifier(String name) {
        return ResourceLocation.fromNamespaceAndPath(MOD_ID, name);
    }

    public static void init() {
        ObjectRegistry.init();
    }
}
"""
