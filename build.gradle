                    "bread_block",
                    "baguette_block",
                    "toast_block",
                    "braided_bread_block",
                    "bun_block",
                    "waffle_block"
            ]

            forcedBlockItemModels.each { name ->
                writeResourceText(
                        "assets/whatsits/models/item/${name}.json",
                        """{
  "parent": "whatsits:block/${name}"
}
"""
                )
            }

        } finally {
            zip.close()
        }
    }
