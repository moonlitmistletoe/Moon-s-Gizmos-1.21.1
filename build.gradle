plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

def bakeryGeneratedRoot = layout.buildDirectory
        .dir("generated/bakery")
        .get()
        .asFile

def bakeryGeneratedResources = new File(
        bakeryGeneratedRoot,
        "resources"
)

def bakeryLangFile = new File(
        bakeryGeneratedRoot,
        "bakery_en_us.json"
)

def bakeryArchive = new File(
        layout.buildDirectory.get().asFile,
        "bakery-1.21.1-source.zip"
)

def prepareBakeryMerge = tasks.register("prepareBakeryMerge") {
    outputs.dir(bakeryGeneratedRoot)

    doLast {
        if (bakeryGeneratedRoot.exists()) {
            bakeryGeneratedRoot.deleteDir()
        }
        bakeryGeneratedResources.mkdirs()

        if (!bakeryArchive.exists()) {
            new URL(
                    "https://github.com/Let-s-Do-Collection/Bakery/archive/refs/heads/1.21.1.zip"
            ).withInputStream { input ->
                bakeryArchive.withOutputStream { output ->
                    output << input
                }
            }
        }

        def zip = new java.util.zip.ZipFile(bakeryArchive)

        try {
            def writeText = { String relativePath, String text ->
                def destination = new File(
                        bakeryGeneratedJava,
                        relativePath
                )

                destination.parentFile.mkdirs()
                destination.text = text
            }

            def writeResourceText = { String relativePath, String text ->
                def destination = new File(
                        bakeryGeneratedResources,
                        relativePath
                )

                destination.parentFile.mkdirs()
                destination.text = text
            }















            def removedNames = [
                    "bakery_banner",
                    "bakery_wall_banner",
                    "cabinet",
                    "drawer",
                    "wall_cabinet",
                    "iron_bench",
                    "iron_chair",
                    "iron_table",
                    "street_sign",
                    "kitchen_sink",
                    "baker_station",
                    "brick_counter",
                    "cake_stand",
                    "cake_display",
                    "cupcake_display",
                    "breadbox",
                    "tray",
                    "bread_crate",
                    "wall_display",
                    "chocolate_box",
                    "small_cooking_pot"
            ] as Set

            def bakeryLangEntry = zip.getEntry(
                    "Bakery-1.21.1/common/src/main/resources/assets/bakery/lang/en_us.json"
            )

            if (bakeryLangEntry != null) {
                bakeryLangFile.parentFile.mkdirs()

                bakeryLangFile.text =
                        zip.getInputStream(
                                bakeryLangEntry
                        ).getText("UTF-8")
            }

            zip.entries().each { entry ->
                if (entry.isDirectory()) {
                    return
                }

                def path = entry.name
                def prefix = "Bakery-1.21.1/"

                if (!path.startsWith(prefix)) {
                    return
                }

                def relative = path.substring(
                        prefix.length()
                )

                if (!relative.startsWith(
                        "common/src/main/resources/assets/bakery/"
                )) {
                    return
                }

                def resourceRelative = relative.substring(
                        "common/src/main/resources/".length()
                )

                if (resourceRelative ==
                        "assets/bakery/lang/en_us.json") {
                    return
                }

                if (resourceRelative ==
                        "assets/bakery/sounds.json") {
                    return
                }

                def lower =
                        resourceRelative.toLowerCase()

                if (removedNames.any { name ->
                    lower.contains(
                            "/" + name.toLowerCase()
                    )
                }) {
                    return
                }

                if (lower.contains("/banner") ||
                        lower.contains("banner/")) {
                    return
                }

                if (resourceRelative.startsWith(
                        "assets/bakery/"
                )) {
                    resourceRelative =
                            "assets/whatsits/" +
                                    resourceRelative.substring(
                                            "assets/bakery/".length()
                                    )
                }

                if (resourceRelative.endsWith(".json") ||
                        resourceRelative.endsWith(".mcmeta")) {

                    def text =
                            zip.getInputStream(
                                    entry
                            ).getText("UTF-8")

                    if (text.contains(
                            "farm_and_charm"
                    )) {
                        return
                    }

                    def destination = new File(
                            bakeryGeneratedResources,
                            resourceRelative
                    )

                    destination.parentFile.mkdirs()

                    destination.text =
                            text
                                    .replace(
                                            "bakery:",
                                            "whatsits:"
                                    )
                                    .replace(
                                            "bakery.",
                                            "whatsits."
                                    )

                } else {

                    def destination = new File(
                            bakeryGeneratedResources,
                            resourceRelative
                    )

                    destination.parentFile.mkdirs()

                    destination.bytes =
                            zip.getInputStream(
                                    entry
                            ).bytes
                }
            }

            /*
             * Force item models for Bakery food items.
             *
             * These are generated here because the merged Bakery blocks
             * and items do not always provide a usable item model once
             * the original Bakery systems have been stripped down.
             */
            def forcedItemTextures = [
                    "blank_cake",
                    "strawberry_cupcake",
                    "sweetberry_cupcake",
                    "apple_cupcake",
                    "strawberry_glazed_cookie",
                    "sweetberry_glazed_cookie",
                    "chocolate_glazed_cookie",
                    "crusty_bread",
                    "bread",
                    "baguette",
                    "toast",
                    "braided_bread",
                    "waffle"
            ]

            def bakeryBlockLootTables = [
                    "strawberry_cake",
                    "sweetberry_cake",
                    "chocolate_cake",
                    "bundt_cake",
                    "linzer_tart",
                    "apple_pie",
                    "glowberry_tart",
                    "pudding",
                    "chocolate_gateau",
                    "chocolate_tart",
                    "blank_cake",
                    "apple_cupcake_block",
                    "sweetberry_cupcake_block",
                    "strawberry_cupcake_block",
                    "chocolate_cookie_block",
                    "sweetberry_cookie_block",
                    "strawberry_cookie_block",
                    "crusty_bread_block",
                    "bread_block",
                    "baguette_block",
                    "toast_block",
                    "braided_bread_block",
                    "bun_block",
                    "waffle_block",
                    "jar",
                    "strawberry_jam",
                    "glowberry_jam",
                    "sweetberry_jam",
                    "chocolate_jam",
                    "apple_jam"
            ]

            bakeryBlockLootTables.each { name ->
                writeResourceText(
                        "data/whatsits/loot_table/blocks/${name}.json",
                        """{
  "type": "minecraft:block",
  "pools": [
    {
      "rolls": 1,
      "entries": [
        {
          "type": "minecraft:item",
          "name": "whatsits:${name}"
        }
      ]
    }
  ]
}
"""
                )
            }

            forcedItemTextures.each { name ->
                writeResourceText(
                        "assets/whatsits/models/item/${name}.json",
                        """{
  "parent": "minecraft:item/generated",
  "textures": {
    "layer0": "whatsits:item/${name}"
  }
}
"""
                )
            }

            /*
             * These are blocks in the merged registry which also receive
             * BlockItems. Give each BlockItem an item model that uses its
             * corresponding block model so it renders properly in the
             * inventory.
             */
            def forcedBlockItemModels = [
                    "blank_cake",
                    "strawberry_cupcake_block",
                    "sweetberry_cupcake_block",
                    "apple_cupcake_block",
                    "strawberry_cookie_block",
                    "sweetberry_cookie_block",
                    "chocolate_cookie_block",
                    "crusty_bread_block",
                    "bread_block",
                    "baguette_block",
                    "toast_block",
                    "braided_bread_block",
                    "bun_block",
                    "waffle_block"
            ]

            forcedBlockItemModels.each { name ->
                writeResourceText(
                        "assets/whatsits/models/item/${name}.json",
                        """{
  "parent": "whatsits:block/${name}"
}
"""
                )
            }

        } finally {
            zip.close()
        }
    }
}


sourceSets.main.resources.srcDir(
        bakeryGeneratedResources
)

repositories {
    maven {
        url = 'https://maven.architectury.dev'
    }

    maven {
        url = 'https://maven.blamejared.com'
    }

    maven {
        url = 'https://api.modrinth.com/maven'
    }

    maven {
        url = "https://cursemaven.com"
    }

    maven {
        url = "https://maven.theillusivec4.top/"
    }

    maven {
        name = "KosmX's Maven"
        url = "https://maven.kosmx.dev/"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion =
        JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion =
                project.parchment_mappings_version

        minecraftVersion =
                project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty(
                    'neoforge.enabledGameTestNamespaces',
                    project.mod_id
            )
        }

        server {
            server()

            programArgument '--nogui'

            systemProperty(
                    'neoforge.enabledGameTestNamespaces',
                    project.mod_id
            )
        }

        gameTestServer {
            type = "gameTestServer"

            systemProperty(
                    'neoforge.enabledGameTestNamespaces',
                    project.mod_id
            )
        }

        data {
            data()

            programArguments.addAll(
                    '--mod',
                    project.mod_id,
                    '--all',
                    '--output',
                    file(
                            'src/generated/resources/'
                    ).getAbsolutePath(),
                    '--existing',
                    file(
                            'src/main/resources/'
                    ).getAbsolutePath()
            )
        }

        configureEach {
            systemProperty(
                    'forge.logging.markers',
                    'REGISTRIES'
            )

            logLevel =
                    org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    jarJar(
            implementation(
                    "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE"
            )
    ) {
        version {
            strictly "[1.21.1-93-NEOFORGE]"
        }
    }

    implementation "dev.kosmx.player-anim:player-animation-lib-forge:2.0.4+1.21.1"

    implementation "curse.maven:farmers-delight-398521:8765184"

    implementation "dev.architectury:architectury-neoforge:13.0.11"

    runtimeOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"

    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"
}

var generateModMetadata =
        tasks.register(
                "generateModMetadata",
                ProcessResources
        ) {

            var replaceProperties = [
                    minecraft_version      : minecraft_version,
                    minecraft_version_range: minecraft_version_range,
                    neo_version            : neo_version,
                    loader_version_range   : loader_version_range,
                    mod_id                 : mod_id,
                    mod_name               : mod_name,
                    mod_license            : mod_license,
                    mod_version            : mod_version,
            ]

            inputs.properties replaceProperties

            expand replaceProperties

            from "src/main/templates"

            into "build/generated/sources/modMetadata"
        }

sourceSets.main.resources.srcDir(
        generateModMetadata
)

neoForge.ideSyncTask(
        generateModMetadata
)

publishing {
    publications {
        register(
                'mavenJava',
                MavenPublication
        ) {
            from components.java
        }
    }

    repositories {
        maven {
            url =
                    "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named(
        "processResources"
).configure {

    dependsOn(prepareBakeryMerge)

    duplicatesStrategy =
            DuplicatesStrategy.INCLUDE

    doLast {

        def outputLang = new File(
                destinationDir,
                "assets/whatsits/lang/en_us.json"
        )

        if (bakeryLangFile.exists() &&
                outputLang.exists()) {

            def bakeryLang =
                    new groovy.json.JsonSlurper().parseText(
                            bakeryLangFile.getText(
                                    "UTF-8"
                            )
                    )

            def whatsitsLang =
                    new groovy.json.JsonSlurper().parseText(
                            outputLang.getText(
                                    "UTF-8"
                            )
                    )

            def removedKeys = [
                    "banner",
                    "cabinet",
                    "drawer",
                    "wall_cabinet",
                    "iron_bench",
                    "iron_chair",
                    "iron_table",
                    "street_sign",
                    "kitchen_sink",
                    "baker_station",
                    "brick_counter",
                    "cake_stand",
                    "cake_display",
                    "cupcake_display",
                    "breadbox",
                    "tray",
                    "bread_crate",
                    "wall_display",
                    "chocolate_box",
                    "small_cooking_pot"
            ]

            Map mergedLang =
                    new LinkedHashMap()

            if (bakeryLang instanceof Map) {

                bakeryLang.each {
                    key, value ->

                        def lowerKey =
                                key.toString()
                                        .toLowerCase()

                        if (!removedKeys.any {
                            lowerKey.contains(it)
                        }) {

                            mergedLang[
                                    key.toString()
                                            .replace(
                                                    "bakery.",
                                                    "whatsits."
                                            )
                                            .replace(
                                                    "bakery:",
                                                    "whatsits:"
                                            )
                            ] = value
                        }
                }
            }

            if (whatsitsLang instanceof Map) {

                whatsitsLang.each {
                    key, value ->
                        mergedLang[key] = value
                }
            }

            outputLang.parentFile.mkdirs()

            outputLang.text =
                    groovy.json.JsonOutput.prettyPrint(
                            groovy.json.JsonOutput.toJson(
                                    mergedLang
                            )
                    ) + "\n"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
