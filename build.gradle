plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        url = 'https://maven.architectury.dev'
    }

    maven {
        url = 'https://maven.blamejared.com'
    }

    maven {
        url = 'https://api.modrinth.com/maven'
    }

    maven {
        url = "https://cursemaven.com"
    }

    maven {
        url = "https://maven.theillusivec4.top/"
    }

    maven {
        name = "KosmX's Maven"
        url = "https://maven.kosmx.dev/"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion =
        JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion =
                project.parchment_mappings_version

        minecraftVersion =
                project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty(
                    'neoforge.enabledGameTestNamespaces',
                    project.mod_id
            )
        }

        server {
            server()

            programArgument '--nogui'

            systemProperty(
                    'neoforge.enabledGameTestNamespaces',
                    project.mod_id
            )
        }

        gameTestServer {
            type = "gameTestServer"

            systemProperty(
                    'neoforge.enabledGameTestNamespaces',
                    project.mod_id
            )
        }

        data {
            data()

            programArguments.addAll(
                    '--mod',
                    project.mod_id,
                    '--all',
                    '--output',
                    file(
                            'src/generated/resources/'
                    ).getAbsolutePath(),
                    '--existing',
                    file(
                            'src/main/resources/'
                    ).getAbsolutePath()
            )
        }

        configureEach {
            systemProperty(
                    'forge.logging.markers',
                    'REGISTRIES'
            )

            logLevel =
                    org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    jarJar(
            implementation(
                    "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE"
            )
    ) {
        version {
            strictly "[1.21.1-93-NEOFORGE]"
        }
    }

    implementation "dev.kosmx.player-anim:player-animation-lib-forge:2.0.4+1.21.1"

    implementation "curse.maven:farmers-delight-398521:8765184"

    implementation "curse.maven:lets-do-farm-charm-1038103:7628193"

    implementation "dev.architectury:architectury-neoforge:13.0.11"

    runtimeOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"

    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"
}

var generateModMetadata =
        tasks.register(
                "generateModMetadata",
                ProcessResources
        ) {

            var replaceProperties = [
                    minecraft_version      : minecraft_version,
                    minecraft_version_range: minecraft_version_range,
                    neo_version            : neo_version,
                    loader_version_range   : loader_version_range,
                    mod_id                 : mod_id,
                    mod_name               : mod_name,
                    mod_license            : mod_license,
                    mod_version            : mod_version,
            ]

            inputs.properties replaceProperties

            expand replaceProperties

            from "src/main/templates"

            into "build/generated/sources/modMetadata"
        }

sourceSets.main.resources.srcDir(
        generateModMetadata
)

neoForge.ideSyncTask(
        generateModMetadata
)

publishing {
    publications {
        register(
                'mavenJava',
                MavenPublication
        ) {
            from components.java
        }
    }

    repositories {
        maven {
            url =
                    "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def decodeBakeryStructure = tasks.register("decodeBakeryStructure") {
    def source = file("src/main/resources/data/whatsits/structure/bakery.nbt.base64")
    def output = layout.buildDirectory.file(
            "generated/resources/data/whatsits/structure/bakery.nbt"
    )

    inputs.file(source)
    outputs.file(output)

    doLast {
        output.get().asFile.parentFile.mkdirs()
        output.get().asFile.bytes =
                java.util.Base64.decoder.decode(
                        source.text.replaceAll("\\s", "")
                )
    }
}

tasks.named(
        "processResources"
).configure {
    dependsOn(decodeBakeryStructure)

    duplicatesStrategy =
            DuplicatesStrategy.INCLUDE

    exclude("**/*.base64")

    notCompatibleWithConfigurationCache("Rewrites merged Bakery resource namespaces after processing")

    doLast {
        def resourceRoot = new File(destinationDir, "assets/whatsits")

        if (resourceRoot.exists()) {
            fileTree(resourceRoot)
                    .matching {
                        include("**/*.json")
                        include("**/*.mcmeta")
                    }
                    .each { file ->
                        def text = file.getText("UTF-8")

                        def fixed = text
                                .replace("bakery:", "whatsits:")
                                .replace("bakery.", "whatsits.")

                        if (fixed != text) {
                            file.setText(fixed, "UTF-8")
                        }
                    }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
