name: Fix lingering namespace references

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Replace old namespace in resources
        run: |
          if grep -RIl --exclude='*.nbt' 'whatsits:' src/main/resources; then
            grep -RIl --exclude='*.nbt' 'whatsits:' src/main/resources | xargs sed -i 's/whatsits:/morrow:/g'
          fi
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources
          git diff --cached --quiet || git commit -m "Fix remaining Morrow namespace references"
          git push
