name: Rename Morrow namespace

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename namespace
        shell: bash
        run: |
          set -e

          for dir in src/main/resources/assets/whatsits src/main/resources/data/whatsits; do
            if [ -d "$dir" ]; then
              find "$dir" -type f \( -name '*.json' -o -name '*.mcmeta' -o -name '*.base64' \) -print0 |
                xargs -0 -r sed -i 's/whatsits/morrow/g'
            fi
          done

          if [ -d src/main/resources/data/farm_and_charm ]; then
            find src/main/resources/data/farm_and_charm -type f -name '*.json' -print0 |
              xargs -0 -r sed -i 's/whatsits/morrow/g'
          fi

          find src/main/java -type f -name '*.java' -print0 |
            xargs -0 -r sed -i -E 's/"whatsits([:"])/"morrow\1/g'

          sed -i 's/mod_id=whatsits/mod_id=morrow/' gradle.properties
          sed -i 's#assets/whatsits#assets/morrow#g; s#data/whatsits#data/morrow#g' build.gradle

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("src/main/java/net/moonlitmistletoe/whatsits/item/ModItems.java")
          s = p.read_text()
          s = s.replace("import net.moonlitmistletoe.whatsits.item.custom.MorrowMusicDiscItem;\n", "")
          s = re.sub(
              r'new MorrowMusicDiscItem\((new Item\.Properties\(\)\.rarity\(Rarity\.RARE\)\.jukeboxPlayable\(DORIME_SONG\)),\s*"[^"]+"\)',
              r'new Item(\1)',
              s
          )
          s = re.sub(
              r'new MorrowMusicDiscItem\((new Item\.Properties\(\)\.rarity\(Rarity\.RARE\)\.jukeboxPlayable\(WORLD_OF_LIES_SONG\)),\s*"[^"]+"\)',
              r'new Item(\1)',
              s
          )
          p.write_text(s)

          lang = Path("src/main/resources/assets/whatsits/lang/en_us.json")
          s = lang.read_text()
          s = re.sub(r'\s*"tooltip\.morrow\.dorime\.description":\s*"[^"]*",\n', '\n', s)
          s = re.sub(r'\s*"tooltip\.morrow\.world_of_lies\.description":\s*"[^"]*"\n', '\n', s)
          lang.write_text(s)
          PY

          rm -f src/main/java/net/moonlitmistletoe/whatsits/item/custom/MorrowMusicDiscItem.java
          rm -f src/main/java/net/moonlitmistletoe/whatsits/item/ModItemTooltips.java

          if [ -d src/main/resources/assets/whatsits ]; then
            mv src/main/resources/assets/whatsits src/main/resources/assets/morrow
          fi

          if [ -d src/main/resources/data/whatsits ]; then
            mv src/main/resources/data/whatsits src/main/resources/data/morrow
          fi

      - name: Commit namespace migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename mod namespace to Morrow"
          git push origin HEAD:main

      - name: Rename GitHub repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" -f name="Morrow-1.21.1"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY_OWNER}/Morrow-1.21.1.git"

      - name: Remove migration workflow
        run: |
          git rm .github/workflows/morrow-namespace.yml
          git commit -m "Remove namespace migration workflow"
          git push origin HEAD:main
